name: build-esp

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Fetch ImGui
        run: git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git imgui

      - name: Build Dobby (pinned by date, HEAD is mid-refactor and does not compile)
        run: |
          git clone https://github.com/jmpews/Dobby.git dobby_src
          git -C dobby_src checkout "$(git -C dobby_src rev-list -1 --before=2023-06-01 HEAD)"
          cmake -S dobby_src -B dobby_build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DDOBBY_GENERATE_SHARED=OFF -DDOBBY_DEBUG=OFF -DPlugin.SymbolResolver=ON
          cmake --build dobby_build
          mkdir -p dobby
          cp dobby_src/include/dobby.h dobby/
          cp "$(find dobby_build -name 'libdobby.a' | head -n1)" dobby/

      - name: Build libesp_core.so
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" build/libesp_core.so

      - uses: actions/upload-artifact@v4
        with:
          name: libesp_core
          path: build/libesp_core.so
